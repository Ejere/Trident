apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trident.fullname" . }}-go-api
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-api
spec:
  replicas: {{ .Values.goApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "go-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trident.selectorLabels" (dict "root" . "component" "go-api") | nindent 8 }}
    spec:
      {{- include "trident.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "trident.podSecurityContext" (dict "uid" .Values.goApi.securityContextUid) | nindent 8 }}
      {{- if .Values.goApi.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.goApi.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.goApi.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.goApi.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "trident.selectorLabels" (dict "root" . "component" "go-api") | nindent 14 }}
      {{- end }}
      containers:
        - name: go-api
          image: "{{ .Values.goApi.image.repository }}:{{ .Values.goApi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "trident.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.goApi.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.goApi.metricsPort }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.internalMTLS.enabled }}
            - name: internal-mtls
              mountPath: {{ .Values.internalMTLS.mountPath }}
              readOnly: true
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: REDIS_URL
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: ADMIN_API_KEY
            - name: API_KEY_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: API_KEY_SALT
            # Required when APP_ENV=production (see goApi.env below) —
            # services/api/middleware.ValidateIdempotencyEncryptionConfig
            # fails startup without it. optional: true so a non-production
            # install with no such key in existingSecret still starts (the
            # app falls back to a random per-process key).
            - name: IDEMPOTENCY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: IDEMPOTENCY_ENCRYPTION_KEY
                  optional: true
            # Set only during a rotation of IDEMPOTENCY_ENCRYPTION_KEY — see
            # global.externalSecret.data's comment on IDEMPOTENCY_ENCRYPTION_KEY.
            - name: IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS
                  optional: true
            {{- if .Values.internalMTLS.enabled }}
            # Behind a flag (issue #320): the Go API dials the gRPC server
            # with a client cert and verifies the server against
            # INTERNAL_CA_CERT. See services/api/grpcclient/client.go.
            - name: GRPC_MTLS_ENABLED
              value: "true"
            - name: GRPC_MTLS_CA_CERT
              value: "{{ .Values.internalMTLS.mountPath }}/ca.crt"
            - name: GRPC_MTLS_CLIENT_CERT
              value: "{{ .Values.internalMTLS.mountPath }}/client.crt"
            - name: GRPC_MTLS_CLIENT_KEY
              value: "{{ .Values.internalMTLS.mountPath }}/client.key"
            {{- end }}
            {{- range $k, $v := .Values.goApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.goApi.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.goApi.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.goApi.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.internalMTLS.enabled }}
        - name: internal-mtls
          secret:
            secretName: {{ .Values.global.existingSecret }}
            items:
              - key: INTERNAL_CA_CERT
                path: ca.crt
              - key: INTERNAL_CLIENT_CERT
                path: client.crt
              - key: INTERNAL_CLIENT_KEY
                path: client.key
        {{- end }}
      {{- with .Values.goApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.goApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.goApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trident.fullname" . }}-go-api
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-api
    # Picked up by the ServiceMonitor's jobLabel (issue #768) as the
    # Prometheus `job` label, matching monitoring/alerts.yml's
    # up{job="trident-api"} matcher exactly.
    job: {{ .Values.monitoring.goApi.jobLabel }}
spec:
  type: ClusterIP
  selector:
    {{- include "trident.selectorLabels" (dict "root" . "component" "go-api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.goApi.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.goApi.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.goApi.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trident.fullname" . }}-go-api
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-api
spec:
  minAvailable: {{ .Values.goApi.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "go-api") | nindent 6 }}
{{- end }}
