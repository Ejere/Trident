# fly/indexer.toml — Trident Stellar event indexer (Rust)
app = "trident-indexer"
primary_region = "iad"

[build]
  dockerfile = "crates/indexer/Dockerfile"

[env]
  # POLL_INTERVAL_MS is no longer read by the poll loop; setting it is now a
  # hard startup error that crash-loops the deploy (issue #777;
  # crates/indexer/src/config.rs:276-281). The adaptive poll interval is
  # controlled by the floor/ceiling pair instead — 5000/5000 reproduces the
  # fixed 5s cadence this app previously ran under POLL_INTERVAL_MS.
  POLL_INTERVAL_FLOOR_MS   = "5000"
  POLL_INTERVAL_CEILING_MS = "5000"
  # Explicit rather than relying on the "testnet" default (issue #777), so a
  # `fly deploy` here can never silently index the wrong network regardless
  # of what NETWORK defaults to in the future. Change to "mainnet" (and set
  # the STELLAR_RPC_URL secret to a mainnet-capable provider — see
  # docs/deployment.md#testnet-vs-mainnet-configuration) when this app is
  # promoted to mainnet.
  NETWORK           = "testnet"
  INDEX_DIAGNOSTIC  = "false"
  METRICS_PORT      = "9090"
  # crates/indexer/src/health.rs serves /healthz and /readyz on this port,
  # separate from the Prometheus listener on METRICS_PORT (crates/indexer/src/
  # config.rs defaults HEALTH_PORT to 8080 if unset; set explicitly here so the
  # checks below stay in sync with it).
  HEALTH_PORT       = "8080"
  LOG_LEVEL         = "info"

# Secrets are sourced exclusively from Fly's encrypted secrets store
# (set via: fly secrets set -a trident-indexer KEY=value), never from [env].
# Required: DATABASE_URL, REDIS_URL, STELLAR_RPC_URL (or STELLAR_RPC_URLS)

# No public HTTP — indexer is a worker process. Both the Prometheus listener
# and the health/readiness listener are reachable only on the private 6PN
# network. Fly's top-level [checks] section (rather than a [[services]] http
# check) is used because it does not require a services.ports entry, i.e. it
# does not force the port to be publicly routable.
[[services]]
  protocol      = "tcp"
  internal_port = 9090

  [[services.ports]]
    port = 9090

  [[services.tcp_checks]]
    interval     = "15s"
    timeout      = "2s"
    grace_period = "30s"

# Readiness check: verifies the process is alive AND that it can reach both
# Postgres and Redis (crates/indexer/src/health.rs readyz() runs `SELECT 1`
# and a Redis PING). A bare TCP check on METRICS_PORT only proves the process
# has a socket open, not that it is actually able to do its job.
[checks]
  [checks.readiness]
    type         = "http"
    port         = 8080
    method       = "get"
    path         = "/readyz"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "30s"

  [checks.liveness]
    type         = "http"
    port         = 8080
    method       = "get"
    path         = "/healthz"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
