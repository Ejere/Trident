# fly/api.toml — Trident Go REST API
app = "trident-api"
primary_region = "iad"

[build]
  dockerfile = "services/api/Dockerfile"

[env]
  PORT      = "3000"
  LOG_LEVEL = "info"
  # Connect to gRPC API over Fly private network (6PN)
  GRPC_ADDR = "trident-grpc-api.internal:50051"
  # Enables JSON structured logging (services/api/logging.go) and, since
  # trident-api runs 2+ machines (see Scaling in docs/deployment.md), makes
  # IDEMPOTENCY_ENCRYPTION_KEY required at startup
  # (middleware.ValidateIdempotencyEncryptionConfig) instead of each machine
  # silently generating its own per-process key.
  APP_ENV   = "production"
  # Fly terminates TLS at its edge and sets Fly-Client-IP to the real client
  # address (issue #779) — this header cannot be set/overridden by the
  # client itself, so no TRUSTED_PROXY_CIDRS is needed here (that CIDR walk
  # only applies to the X-Forwarded-For fallback used behind nginx/Helm).
  # See services/api/middleware/abuse.go (trustedClientIP).
  TRUSTED_PROXY_ENABLED = "true"

# Secrets are sourced exclusively from Fly's encrypted secrets store
# (set via: fly secrets set -a trident-api KEY=value), never from [env].
# Required: DATABASE_URL, REDIS_URL, API_KEY_SALT (services/api/middleware/auth.go
# HMACs incoming keys with this), ADMIN_API_KEY (guards /v1/admin/*),
# IDEMPOTENCY_ENCRYPTION_KEY (64 hex chars / 32 bytes — required because
# APP_ENV=production above; see services/api/middleware/idempotency.go)
# Required for the legacy env-var auth path: API_KEY_HASHES (skip only if all
# API keys are issued through the DB-backed /v1/admin/keys flow instead)
# Optional: NETWORK (label only, used by GET /v1/stats/contracts response),
# STELLAR_RPC_URL (enables POST /v1/admin/contracts/{id}/call),
# PGBOUNCER_ADMIN_URL (enables GET /v1/admin/db pool stats),
# IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS (set only while rotating
# IDEMPOTENCY_ENCRYPTION_KEY)

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  # Fly has no separate liveness/readiness concept — this single check gates
  # whether the proxy routes traffic to the machine, so it needs readiness
  # semantics (issue #243): /v1/ready checks Postgres/Redis/gRPC reachability,
  # not just /v1/health's cheap liveness check.
  [[http_service.checks]]
    interval     = "10s"
    timeout      = "5s"
    grace_period = "15s"
    method       = "GET"
    path         = "/v1/ready"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
