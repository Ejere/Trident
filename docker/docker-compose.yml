# Production compose — runs all four services.
# All secrets are passed via environment variables; never hardcode values here.

services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:de13e74e14b98eb96bdf886791ae47686c3c5d29f9d5f85ea55206843e3fce26
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PgBouncer — transaction-mode connection pooler (issue #87)
  #
  # Every service connects here (pgbouncer:6432) instead of Postgres directly.
  # PgBouncer multiplexes the many short-lived application connections over a
  # small set of real Postgres connections, so Postgres never approaches its
  # max_connections limit even with several Go API replicas.
  #
  # Transaction mode holds a server connection only for the duration of a
  # transaction; idle client connections cost nothing. See docs/deployment.md
  # for the prepared-statement / session-variable caveats this implies.
  # ---------------------------------------------------------------------------
  pgbouncer:
    # NOTE: pgbouncer/pgbouncer never published a 1.22 tag — its newest is
    # 1.15.0 — and the digest previously pinned here did not exist either, so
    # this service could not start at all (issue #371). Pinned to the real
    # 1.15.0. If a newer PgBouncer is needed, edoburu/pgbouncer tracks
    # upstream far more closely (v1.25.x), but it takes a different
    # configuration contract than the PGBOUNCER_* variables set below, so
    # switching is a deliberate change rather than a retag.
    image: pgbouncer/pgbouncer:1.15.0@sha256:aa8a38b7b33e5fe70c679053f97a8e55c74d52b00c195f0880845e52b50ce516
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: ${POSTGRES_DB}
      DATABASES_USER: ${POSTGRES_USER}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_LISTEN_PORT: 6432
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      # With scram-sha-256 and no userlist file, PgBouncer has no credentials
      # to verify against and rejects every login to the virtual `pgbouncer`
      # database with "no such user" — which is why GET /v1/admin/db could
      # never return 200 (the admin console was unreachable, not misrouted).
      # AUTH_USER/AUTH_QUERY let it look the hash up in Postgres instead of
      # maintaining a userlist that would duplicate the password in a second
      # place.
      PGBOUNCER_AUTH_USER: ${POSTGRES_USER}
      PGBOUNCER_AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$$1
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      # DEFAULT_POOL_SIZE is the per-(user,db) ceiling of real connections
      # PgBouncer keeps open to Postgres. In transaction mode it must cover the
      # transactions running at the same moment, not the sum of every client
      # pool (indexer 3 + gRPC API 10 + 3 Go API replicas * 5 = 28 clients is
      # fine on 20). Re-size it, and Postgres max_connections, when scaling
      # out: see "Sizing pools as replicas scale" in docs/deployment.md.
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_SERVER_TLS_SSLMODE: prefer
      # Allow the application user to read SHOW POOLS / SHOW STATS from the
      # admin console (consumed by GET /v1/admin/db).
      PGBOUNCER_ADMIN_USERS: ${POSTGRES_USER}
      PGBOUNCER_STATS_USERS: ${POSTGRES_USER}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: ..
      dockerfile: crates/indexer/Dockerfile
    environment:
      # Route through PgBouncer, never postgres:5432 directly.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      INDEXER_DB_POOL_SIZE: ${INDEXER_DB_POOL_SIZE:-3}
      REDIS_URL: ${REDIS_URL}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL}
      NETWORK: ${NETWORK}
      INDEX_DIAGNOSTIC: ${INDEX_DIAGNOSTIC}
      # Rows per batched INSERT when a page is committed (statement size only —
      # the page is always one transaction).
      DB_BATCH_SIZE: ${DB_BATCH_SIZE:-1000}
      # Topic patterns added to the getEvents filter. Empty means no topic
      # narrowing, which is the default.
      INDEX_TOPIC_FILTERS: ${INDEX_TOPIC_FILTERS:-}
      METRICS_PORT: ${METRICS_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${METRICS_PORT}:${METRICS_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${METRICS_PORT}/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      # Root context: services/api/Dockerfile uses repo-root-relative COPY
      # paths (COPY services/api/...), matching the standalone CI image build.
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      # Route through PgBouncer, never postgres:5432 directly.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      GO_API_DB_POOL_SIZE: ${GO_API_DB_POOL_SIZE:-5}
      # PgBouncer admin console — backs GET /v1/admin/db.
      PGBOUNCER_ADMIN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
      API_KEY_SALT: ${API_KEY_SALT}
      API_KEY_HASHES: ${API_KEY_HASHES}
      # Required: middleware.ValidateAllowedOrigins fails startup when this is
      # unset. There is deliberately no default — a wildcard fallback here
      # would silently disable CORS enforcement for every deployment.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_DEV_MODE: ${CORS_DEV_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL}
      # Required when APP_ENV=production: middleware.ValidateIdempotencyEncryptionConfig
      # fails startup when unset, since without it a retried create landing
      # on a different replica can't decrypt the first attempt's idempotency
      # record (services/api/middleware/idempotency.go).
      APP_ENV: ${APP_ENV:-development}
      IDEMPOTENCY_ENCRYPTION_KEY: ${IDEMPOTENCY_ENCRYPTION_KEY:-}
      # Set only while rotating IDEMPOTENCY_ENCRYPTION_KEY — see
      # docs/deployment.md#rotating-idempotency_encryption_key.
      IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS: ${IDEMPOTENCY_ENCRYPTION_KEY_PREVIOUS:-}
    ports:
      - "${PORT}:${PORT}"
    # Probe /v1/ready (issue #243), not /v1/health — compose's healthcheck
    # gates other services' `depends_on: condition: service_healthy`, so it
    # needs the readiness semantics (DB/Redis/gRPC reachable), not just
    # liveness. wget is used instead of curl because it is available in the
    # scratch/alpine base images without adding an extra layer. The
    # 4-second timeout matches the handler's 3-second per-check timeout plus
    # one second of slack.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:${PORT}/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      indexer:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: